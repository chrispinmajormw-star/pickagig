<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PickAGig — Find temporary work, side jobs and local people who need your skills in Blantyre, Malawi.">
  <title>PickAGig — Find work nearby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div class="app">

  <!-- ═══════════════════════════════════════════════════════
       GRADIENT PANEL — morphs content per page
  ════════════════════════════════════════════════════════════ -->
  <div class="panel" id="panel">

    <!-- Top bar: brand OR page title, always has lang + bell -->
    <div class="panel-top">

      <!-- Gigs brand (shown on gigs page) -->
      <div id="panelBrand">
        <div class="brand-name">PickAGig</div>
        <div class="brand-tagline" id="heroSubtitle"></div>
      </div>

      <!-- Page header (shown on non-gigs pages) -->
      <div id="panelPageHeader" style="display:none">
        <h1 class="panel-page-title" id="panelPageTitle"></h1>
        <p  class="panel-page-sub"   id="panelPageSub"></p>
      </div>

      <!-- Always-visible: lang switcher + bell -->
      <div class="panel-actions">
        <button class="lang-pill" data-lang="EN" onclick="setLang('EN')">EN</button>
        <button class="lang-pill" data-lang="NY" onclick="setLang('NY')">NY</button>
        <button class="bell-btn" aria-label="Notifications" onclick="toast('Notifications coming soon.')">
          <!-- Bell SVG -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>
    </div>

    <!-- Gigs-only extra: location + search (hidden on other pages) -->
    <div id="panelGigsBody">
      <div class="location-row" id="locationText"></div>
      <div class="search-wrap">
        <!-- Search icon -->
        <svg class="search-icon-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="search" autocomplete="off" oninput="onSearch(this.value)">
        <!-- Filter icon -->
        <svg class="filter-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" onclick="toast('Advanced filters coming soon.')" style="cursor:pointer" aria-label="Filters"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      </div>
    </div>

  </div><!-- /.panel -->

  <!-- ── Category Filters (gigs page only) ─────────────────── -->
  <div class="filters" id="filtersBar"></div>

  <!-- ═══════════════════════════════════════════════════════
       PAGE: GIGS
  ════════════════════════════════════════════════════════════ -->
  <div id="pageGigs">
    <main class="content">
      <div class="section-head">
        <h2 id="gigsHeading"></h2>
        <span class="map-link" id="mapLinkBtn" onclick="navigate('map')"></span>
      </div>
      <div id="gigsGrid"></div>
      <div class="empty" id="gigsEmpty"></div>
    </main>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       PAGE: MAP
  ════════════════════════════════════════════════════════════ -->
  <div id="pageMap" style="display:none">
    <div class="map-content">
      <div id="map"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       PAGE: CHATS
  ════════════════════════════════════════════════════════════ -->
  <div id="pageChats" style="display:none">
    <main class="content">
      <div id="chatsList"></div>
    </main>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       PAGE: PROFILE
  ════════════════════════════════════════════════════════════ -->
  <div id="pageProfile" style="display:none"></div>

  <!-- ═══════════════════════════════════════════════════════
       BOTTOM NAVIGATION
  ════════════════════════════════════════════════════════════ -->
  <nav class="bottom" aria-label="Main navigation">

    <button class="nav active" data-page="gigs" id="nav-gigs" onclick="navigate('gigs')">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
      <span data-nav-label="navGigs"></span>
    </button>

    <button class="nav" data-page="map" id="nav-map" onclick="navigate('map')">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span data-nav-label="navMap"></span>
    </button>

    <button class="nav nav-post" data-page="post" id="nav-post" onclick="navigate('post')">
      <div class="post-fab" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <span data-nav-label="navPost"></span>
    </button>

    <button class="nav" data-page="chats" id="nav-chats" onclick="navigate('chats')">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span data-nav-label="navChats"></span>
    </button>

    <button class="nav" data-page="profile" id="nav-profile" onclick="navigate('profile')">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span data-nav-label="navProfile"></span>
    </button>

  </nav>

</div><!-- /.app -->

<!-- ═══════════════════════════════════════════════════════════
     MODAL BOTTOM SHEET
════════════════════════════════════════════════════════════════ -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="close" onclick="closeModal()" aria-label="Close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/main.js?v=3"></script>
</body>
</html>
